name: Runner test

on:
  workflow_dispatch:

jobs:
  actuated-linux:
    name: Actuated Linux
    runs-on: actuated-arm64-2cpu-4gb
    steps:
      - name: Show runner details
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          uname -a
          cat /etc/os-release
          nproc

  macos:
    name: Actuated macOS
    runs-on: actuated-macos-arm64-2cpu-4gb
    steps:
      - name: Show runner details
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          uname -a
          sw_vers
          sysctl -n hw.ncpu

      - name: Download a known payload
        run: |
          sleep 30
          expected=64723756
          actual=$(curl --fail --location --silent --show-error \
            --output payload.tar.gz \
            --write-out '%{size_download}' \
            "https://go.dev/dl/go1.26.4.darwin-arm64.tar.gz")
          test "$actual" -eq "$expected"
          echo "Downloaded ${actual} bytes"
          netstat -ibn
          sleep 60
